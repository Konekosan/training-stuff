<div class="container">
    <h1>Informations Personnelles</h1>

    <div class="mb-5">
      <label class="input-label">Nom</label>
      <input type="text" id="nom" class="form-control small-input">
    </div>

    <div class="mb-5">
      <label class="input-label">Prenom</label>
      <input type="text" id="Prenom" class="form-control small-input">
    </div>

    <div class="mb-5">
      <label class="input-label">Email</label>
      <input type="email" id="email" class="form-control small-input">
    </div>

    <div class="mb-5">
      <label class="input-label">Date de naissance</label>
      <div class="mb-5 small-input">
        <mat-form-field appearance="fill" class="w-100">
          <mat-label>Date de naissance</mat-label>
          <input matInput [matDatepicker]="picker">
          <mat-hint>JJ/MM/AAAA</mat-hint>
          <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>
      </div>
    </div>

    <div class="buttons">
      <button mat-raised-button (click)="previous()">Retour</button>
      <button mat-raised-button color="primary" (click)="next()">Suivant</button>
    </div>
</div>
