<h1>Compte</h1>

<form [formGroup]="form">
  <div class="mb-5">
    <label class="input-label">Identifiant</label>
    <input type="text" formControlName="identifiant" class="form-control small-input">
  </div>

  <div class="mb-5">
    <label class="input-label">Mot de passe</label>
    <input type="password" formControlName="hashed_password" class="form-control small-input">
  </div>

  <div class="mb-5">
    <label class="input-label">Confirmation de Mot de passe</label>
    <input type="password" formControlName="confirm_pwd" class="form-control small-input">
  </div>

</form>
