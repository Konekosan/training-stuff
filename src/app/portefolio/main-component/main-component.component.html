<div class="container">
  <div class="row">
    <div class="col-12 col-md-6 col-lg-4 mb-4" *ngFor="let card of cards">
      <a [routerLink]="'/portefolio/' + card.route" class="text-decoration-none">
        <div class="card clickable-card h-100">
          <div class="card-body text-center">
            <i *ngIf="card.icon" [class]="'bi ' + card.icon + ' mb-2 fs-2'"></i>
            <h5 class="card-title">{{ card.title }}</h5>
            <p class="card-text">{{ card.description }}</p>
          </div>
        </div>
      </a>
    </div>
  </div>
</div>

<router-outlet></router-outlet>
