<mat-toolbar color="primary" class="top-bar">
  <span class="logo" routerLink="/">Benjamin Para.</span>
  
  <span class="spacer"></span>

  <nav class="nav-links" *ngIf="authService.currentUser$">
    <a mat-button routerLink="/portefolio"  *ngIf="authService.currentUser$ | async">Portefolio</a>
    <a mat-button routerLink="/about">À propos</a>
    <a mat-button routerLink="/contact">Contact</a>
  </nav>

  <!-- Utilisateur connecté -->
  <ng-container *ngIf="authService.currentUser$ | async as user; else loginBtn">
    
    <button mat-button [matMenuTriggerFor]="menu">
      <mat-icon>account_circle</mat-icon>
      <span class="username">{{ user.nom }}</span>
    </button>

    <mat-menu #menu="matMenu">
      <button mat-menu-item>
        <mat-icon>person</mat-icon>
        <span>Profil</span>
      </button>

      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Déconnexion</span>
      </button>
    </mat-menu>

  </ng-container>

  <!-- Si pas connecté -->
  <ng-template #loginBtn>
    <button mat-button routerLink="/login">
      <mat-icon>login</mat-icon>
      Connexion
    </button>
  </ng-template>

</mat-toolbar>
